<div id="already-streaming-modal" class="container">
    <div class="row">
        <h2><span class='fa fa-share-alt modal-icon'></span> Streaming</h2>
    </div>
    <form onsubmit="return false;">
        <div class="row">
            <p>
                You are currently streaming your mission plan.
            </p>
        </div>
        <div class="row">
            <div class="input-with-button">
                <input id="already-stream-name" class="half-width" readonly value="{streamName}"></input>
                <button id="copy-already-name" type="button" class="small-button">Copy</button>
            </div>
        </div>
        <div class="row">
            <div class="six columns">
                <label class="checkbox-label" for="already-streaming-password-checkbox">
                    Show password
                </label>
            </div>
            <div class="six columns">
                <input id="already-streaming-password-checkbox" name="already-streaming-password-checkbox" type="checkbox">
            </div>
        </div>
        <div id="already-streaming-password-row" class="row hidden-section">
            <div class="row">
                <label for="already-stream-password">Password</label>
                <div class="input-with-button">
                    <input id="already-stream-password" class="half-width" readonly value="{streamPassword}"></input>
                    <button id="copy-already-password" type="button" class="small-button">Copy</button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="six columns">
                <label class="checkbox-label" for="already-streaming-code-checkbox">
                    Show leader code
                </label>
            </div>
            <div class="six columns">
                <input id="already-streaming-code-checkbox" name="already-streaming-code-checkbox" type="checkbox">
            </div>
        </div>
        <div id="already-streaming-code-row" class="row hidden-section">
            <div class="row">
                <label for="already-stream-code">Leader Code</label>
                <div class="input-with-button">
                    <input id="already-stream-code" class="half-width" readonly value="{streamCode}"></input>
                    <button id="copy-already-code" type="button" class="small-button">Copy</button>
                </div>
            </div>
        </div>
        <div class="row buttom-row">
            <button id="stop-streaming-button" class="modal-ok button-primary" type="submit">Stop Streaming</button>
            <button class="modal-cancel">Cancel</button>
        </div>
    </form>
</div>
